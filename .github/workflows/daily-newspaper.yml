# [응용과제] PC가 꺼져 있어도 GitHub 클라우드에서 신문 발행
#
# 기본값: 정기 실행 꺼짐 (아래 AUTOMATION 블록에 schedule 이 없으면 GitHub 가 이 워크플로를
#         절대 스스로 실행하지 않는다). Actions 탭 > Run workflow 로 수동 실행만 가능.
#         정기 실행 켜기/끄기: 로컬에서 automation.bat cloud on / off
#
# 사전 준비 (저장소 Settings > Secrets and variables > Actions):
#   Secrets  : GMAIL_USER, GMAIL_APP_PASSWORD, GEMINI_API_KEY
#   Variables: NEWSPAPER_TITLE, PUBLISHER_NAME, EDITION_NAME, PUBLISH_DAYS (선택)
#   Pages    : Settings > Pages > Build and deployment > Source = "GitHub Actions"
# 발행된 Output/ 은 저장소에 커밋되고, GitHub Pages
# (https://<계정>.github.io/<저장소>/)로 배포되어 브라우저에서 바로 읽을 수 있다.
name: Daily Newspaper

on:
  workflow_dispatch:
    inputs:
      date:
        description: "발행일 YYYY-MM-DD (비우면 가장 최근 발행일 08:00 기준)"
        required: false
        default: ""
  # >>> AUTOMATION:schedule — automation.bat cloud on/off 로만 전환하세요 (직접 수정 금지)
  # (꺼짐) schedule 트리거 없음 → GitHub 가 이 워크플로를 스스로 실행하지 않습니다.
  # 켜기: automation.bat cloud on
  # <<< AUTOMATION:schedule

# 기본 권한은 없음. 각 job 이 필요한 권한만 따로 받는다.
permissions: {}

concurrency:
  group: daily-newspaper
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # 발행된 Output/ 커밋·push
    # 시크릿은 여기(job 전체)에 두지 않는다. pip install 등 다른 단계의 코드가 읽지 못하도록
    # 실제로 필요한 "Publish newspaper" 단계에만 넘긴다.
    env:
      TZ: Asia/Seoul
      PYTHONUTF8: "1"
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      GMAIL_LABEL: ${{ vars.GMAIL_LABEL }}
      NEWSPAPER_TITLE: ${{ vars.NEWSPAPER_TITLE }}
      PUBLISHER_NAME: ${{ vars.PUBLISHER_NAME }}
      EDITION_NAME: ${{ vars.EDITION_NAME }}
      PUBLISH_DAYS: ${{ vars.PUBLISH_DAYS }}
      PUBLISH_HOUR: ${{ vars.PUBLISH_HOUR }}

    steps:
      - name: Check secrets
        # 값 자체가 아니라 "등록됨 여부(true/false)"만 넘긴다.
        env:
          HAS_GMAIL: ${{ secrets.GMAIL_USER != '' && secrets.GMAIL_APP_PASSWORD != '' }}
          HAS_GEMINI: ${{ secrets.GEMINI_API_KEY != '' }}
        run: |
          if [ "$HAS_GMAIL" != "true" ]; then
            echo "::error::Secrets 에 GMAIL_USER / GMAIL_APP_PASSWORD 를 등록하세요 (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          if [ "$HAS_GEMINI" != "true" ]; then
            echo "::warning::GEMINI_API_KEY 가 없어 규칙 기반 편집으로 발행합니다."
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Publish newspaper
        id: publish
        env:
          EDITION_DATE: ${{ inputs.date }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$EDITION_DATE" ]; then
            python Source/main.py --date "$EDITION_DATE"
          else
            python Source/main.py
          fi

      - name: Commit newspaper
        env:
          EDITION: ${{ steps.publish.outputs.edition }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A Output
          if git diff --cached --quiet; then
            echo "변경된 신문이 없습니다."
            exit 0
          fi
          git commit -m "chore: ${EDITION:-$(date +%F)} 신문 발행 (GitHub Actions)"
          git pull --rebase
          git push

      # Pages 에는 공개용 산출물만 올린다 (실행 로그·데모·미리보기는 제외).
      - name: Prepare Pages site
        run: |
          mkdir -p _site
          cp -r Output/. _site/
          rm -rf _site/*.log _site/_debug _site/_demo _site/demo.html _site/preview.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Upload newspaper & log
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: newspaper-${{ github.run_id }}
          path: |
            Output/*.html
            Output/daily_run.log
          if-no-files-found: ignore
          retention-days: 14

  deploy-pages:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write      # Pages 배포
      id-token: write   # Pages 배포용 OIDC 토큰
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
