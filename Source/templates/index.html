<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} — 지난 신문</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
  <style>
{{ css | safe }}
    .archive { max-width: 560px; margin: 0 auto; padding: 0; list-style: none; }
    .archive li { border-bottom: 1px solid var(--line); }
    .archive a {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 4px; text-decoration: none; font-size: 17px; color: var(--ink);
    }
    .archive a:hover { background: var(--sub-bg); }
    .archive .weekday { color: var(--faint); font-size: 14px; }
    .archive .latest .badge { margin: 0 0 0 10px; font-size: 12px; }
  </style>
</head>
<body>
  <main class="paper">
    <header class="masthead">
      <h1>{{ title }}</h1>
      <p class="dateline">발행인 {{ publisher }} · 지난 신문 {{ editions | length }}호</p>
    </header>
    <hr class="rule">
    {% if editions %}
    <ul class="archive">
      {% for e in editions %}
      <li{% if loop.first %} class="latest"{% endif %}>
        <a href="{{ e.file }}">
          <span>{{ e.date.isoformat() }}{% if loop.first %}<span class="badge">🔥 최신호</span>{% endif %}</span>
          <span class="weekday">{{ "월화수목금토일"[e.date.weekday()] }}요일</span>
        </a>
      </li>
      {% endfor %}
    </ul>
    {% else %}
    <p class="empty">아직 발행된 신문이 없습니다.</p>
    {% endif %}
  </main>
</body>
</html>
